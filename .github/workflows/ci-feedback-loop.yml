name: CI Feedback Loop

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  ci-feedback:
    name: Post-Merge CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Lint
        run: pnpm run lint 2>&1
        continue-on-error: true
        id: lint

      - name: Type check
        run: pnpm run check 2>&1
        continue-on-error: true
        id: typecheck

      - name: Test
        run: pnpm run --if-present test 2>&1
        continue-on-error: true
        id: test

      - name: Create issue on failure
        if: steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.COMMIT_SHA.slice(0, 7);
            const steps = {
              lint: process.env.LINT_OUTCOME,
              typecheck: process.env.TYPECHECK_OUTCOME,
              test: process.env.TEST_OUTCOME
            };
            const failures = Object.entries(steps)
              .filter(([_, o]) => o === 'failure')
              .map(([n]) => n);
            if (failures.length === 0) return;

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 20
            });
            const already = existing.data.some(i => i.title.includes(sha));
            if (already) return;

            await github.rest.issues.create({
              owner, repo,
              title: `[ci-feedback] Post-merge CI failure at ${sha}`,
              body: `CI failed after merge to main at commit ${sha}.\n\nFailing steps: ${failures.join(', ')}\n\n@copilot Please fix these failures.`,
              labels: ['ci-failure', 'bug']
            });
