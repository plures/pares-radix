name: Copilot PR Lifecycle

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  issues:
    types: [opened, labeled]
  milestone:
    types: [closed]
  schedule:
    - cron: '0 */2 * * *'  # every 2h fallback sweep (event triggers handle real-time); cut from */30 to reduce Actions spend
  workflow_dispatch:

jobs:
  lifecycle:
    # Skip for any event related to Dependabot branches.
    # check_suite and pull_request_review events have a non-dependabot actor even on
    # Dependabot PRs, so we guard with branch-name checks in addition to the actor check.
    if: >-
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.event.check_suite.head_branch, 'dependabot/') &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      (
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    uses: plures/.github/.github/workflows/copilot-pr-lifecycle-reusable.yml@main
    secrets:
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
