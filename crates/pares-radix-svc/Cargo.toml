[package]
name = "pares-radix-svc"
description = "Headless service runtime for pares-radix: drives the AgensRuntime timer/event loop with a loopback HTTP automation surface, PluresDB-only persistence, no Tauri/Hyperswarm/LLM dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pares-radix-svc"
path = "src/main.rs"

[lib]
name = "pares_radix_svc"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
uuid.workspace = true
anyhow = "1"
pluresdb = { git = "https://github.com/plures/pluresdb", rev = "2af92b1923e11e41c9103ad8f14900b179d839f6", features = ["embeddings"] }
pluresdb-procedures = { git = "https://github.com/plures/pluresdb", rev = "2af92b1923e11e41c9103ad8f14900b179d839f6" }
pares-radix-core = { path = "../radix-core" }
pares-radix-praxis = { path = "../praxis" }
async-trait = "0.1"

[dev-dependencies]
tempfile.workspace = true
reqwest = { workspace = true, features = ["json"] }
